# =============================================================================
# Dughu Web — vhost Nginx — testing.dughu.com
#
# ⚠ NON UTILISÉ sur le serveur actuel (203.161.53.131) : celui-ci tourne sous
# Apache et héberge déjà d'autres sites. La configuration en vigueur est
# deploy/apache/testing.dughu.com.conf. Installer nginx sur ce serveur ferait
# tomber help.dughu.com et kibana.dughu.com.
#
# Ce fichier est conservé pour le jour où l'application sera déplacée sur un
# serveur dédié.
#
#   sudo cp deploy/nginx/dughu.conf /etc/nginx/sites-available/dughu
#   sudo ln -s /etc/nginx/sites-available/dughu /etc/nginx/sites-enabled/dughu
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le bloc TLS est ajouté automatiquement par :
#   sudo certbot --nginx -d testing.dughu.com
# =============================================================================

upstream dughu_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP : redirection vers HTTPS (certbot réécrit ce bloc) ------------------
server {
    listen 80;
    listen [::]:80;
    server_name testing.dughu.com;

    # Laisser passer les challenges Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name testing.dughu.com;

    # ssl_certificate / ssl_certificate_key : renseignés par certbot

    # Les médias transitent par les routes API vers le backend Dughu.
    # Sans cette directive, les uploads sont rejetés en 413.
    client_max_body_size 50M;
    client_body_timeout 120s;

    # En-têtes de sécurité (l'app n'expose plus X-Powered-By, cf. next.config.ts).
    # Attention : un `add_header` dans un bloc `location` annule TOUS ceux
    # hérités d'ici. Les locations ci-dessous qui posent du Cache-Control
    # redéclarent donc ces en-têtes — toute modification doit être reportée.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Environnement de recette : ne pas laisser les moteurs indexer testing.
    # À RETIRER lors du passage sur le domaine de production.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Assets immuables ------------------------------------------------------
    # Les fichiers de .next/static portent un hash dans leur nom : on les met en
    # cache navigateur pour un an. On les laisse servir par le conteneur plutôt
    # que par un `alias` sur le disque hôte : extraire .next/static de l'image à
    # chaque déploiement est une source classique d'assets périmés après un
    # rollback.
    location /_next/static/ {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /images/ {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- Sonde de santé : pas de log, pas de cache ----------------------------
    location = /api/health {
        proxy_pass http://dughu_app;
        access_log off;
        proxy_set_header Host $host;
    }

    # --- Application ----------------------------------------------------------
    location / {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : les cookies de session dughu_token / dughu_user_id
        # sont posés avec l'attribut `secure` en production.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Connection vide = réutilisation des connexions keepalive vers
        # l'upstream. L'application n'utilise pas de WebSocket.
        proxy_set_header Connection        "";

        # Streaming de l'App Router : la bufferisation le casserait.
        proxy_buffering off;
        proxy_cache off;

        # L'API Dughu peut être lente (timeout applicatif : DUGHU_API_TIMEOUT).
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
