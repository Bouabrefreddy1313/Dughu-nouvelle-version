# =============================================================================
# Dughu Web — vhost Nginx — testing.dughu.com
#
# Écrit dans le style déjà en place sur le serveur de déploiement : un vhost
# `:80` simple, dont `certbot --nginx` dérive le bloc `:443` et la redirection
# HTTPS. On n'écrit donc jamais de directive `ssl_certificate` à la main — elle
# pointerait vers un fichier inexistant et ferait échouer `nginx -t` pour TOUT
# le serveur, y compris les sites déjà en ligne.
#
# ---------------------------------------------------------------------------
#   sudo cp deploy/nginx/dughu.conf /etc/nginx/sites-available/testing.dughu.com
#   sudo ln -s /etc/nginx/sites-available/testing.dughu.com \
#              /etc/nginx/sites-enabled/testing.dughu.com
#   sudo nginx -t                      # DOIT afficher "syntax is ok"
#   sudo systemctl reload nginx        # reload, jamais restart
#   sudo certbot --nginx -d testing.dughu.com
# ---------------------------------------------------------------------------
#
# Si l'application doit cohabiter avec des sites servis par Apache et qu'Apache
# tient déjà le port 80, utiliser deploy/apache/testing.dughu.com.conf.
# =============================================================================

upstream dughu_app {
    # ⚠ Doit correspondre à APP_PORT dans le .env du serveur.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name testing.dughu.com;

    # Les médias transitent par les routes API vers le backend Dughu.
    # Sans cette directive, les uploads sont rejetés en 413.
    client_max_body_size 50M;
    client_body_timeout 120s;

    # En-têtes de sécurité. L'application n'expose plus X-Powered-By
    # (poweredByHeader: false dans next.config.ts).
    # Attention : un `add_header` dans un bloc `location` annule TOUS ceux
    # hérités d'ici. Les locations ci-dessous qui posent du Cache-Control les
    # redéclarent — toute modification doit être reportée aux trois endroits.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Environnement de recette : ne pas laisser les moteurs l'indexer.
    # À RETIRER lors du passage sur le domaine de production.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # --- Assets immuables ----------------------------------------------------
    # Next.js sert /_next/static avec un nom de fichier haché ; on les met en
    # cache navigateur pour un an. Ils restent servis par le conteneur plutôt
    # que par un `alias` sur le disque : extraire .next/static de l'image à
    # chaque déploiement est une source classique d'assets périmés après un
    # rollback.
    location /_next/static/ {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
        # Pas de Cache-Control ici : Next.js émet déjà
        # `public, max-age=31536000, immutable` sur /_next/static (vérifié).
        # `add_header` ajoute un en-tête, il n'en remplace jamais un — en
        # poser un ici produirait deux Cache-Control identiques.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /images/ {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
        # Next sert les fichiers de public/ en `public, max-age=0`. Il faut
        # masquer cet en-tête pour que le nôtre le remplace au lieu de s'y
        # ajouter.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- Sonde de santé : ni log, ni cache -----------------------------------
    location = /api/health {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- Application ----------------------------------------------------------
    location / {
        proxy_pass http://dughu_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : les cookies de session dughu_token / dughu_user_id
        # sont posés avec l'attribut `secure` en production.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Connection vide = réutilisation des connexions keepalive vers
        # l'upstream. L'application n'utilise pas de WebSocket.
        proxy_set_header Connection        "";

        # Streaming de l'App Router : la bufferisation le casserait.
        proxy_buffering off;
        proxy_cache off;

        # L'API Dughu peut être lente (timeout applicatif : DUGHU_API_TIMEOUT).
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
