# =============================================================================
# Dughu Web — vhost Apache — testing.dughu.com
#
# Ce serveur héberge DÉJÀ d'autres sites (help.dughu.com, kibana.dughu.com,
# admintesting.dughu.com) servis par Apache. On AJOUTE un vhost : rien n'est
# installé, remplacé ni désactivé.
#
# ---------------------------------------------------------------------------
#   1. Modules requis (idempotent, sans effet s'ils sont déjà actifs)
#        sudo a2enmod proxy proxy_http headers rewrite ssl
#
#   2. Pose du vhost
#        sudo cp deploy/apache/testing.dughu.com.conf \
#                /etc/apache2/sites-available/testing.dughu.com.conf
#        sudo a2ensite testing.dughu.com
#
#   3. VÉRIFIER AVANT DE RECHARGER — cette commande doit afficher "Syntax OK".
#      Si elle échoue, corrige avant d'aller plus loin : un reload sur une
#      configuration invalide est refusé, mais un restart couperait TOUS les
#      sites du serveur.
#        sudo apache2ctl configtest
#
#   4. Rechargement — `reload`, jamais `restart` : les autres sites ne sont
#      pas interrompus.
#        sudo systemctl reload apache2
#
#   5. Certificat. certbot crée lui-même le vhost :443 en recopiant celui-ci,
#      et y ajoute la redirection HTTP -> HTTPS. C'est pour cette raison que
#      toute la configuration du proxy est ici, dans le vhost :80.
#        sudo certbot --apache -d testing.dughu.com
# ---------------------------------------------------------------------------
#
# Sur RHEL / CentOS / AlmaLinux : le fichier va dans /etc/httpd/conf.d/, il n'y
# a ni a2enmod ni a2ensite, et les logs sont dans /var/log/httpd (remplacer
# ${APACHE_LOG_DIR}).
# =============================================================================

<VirtualHost *:80>
    ServerName testing.dughu.com

    # Ne jamais se comporter en proxy ouvert (forward proxy).
    ProxyRequests Off

    # Transmettre le Host d'origine : l'application en a besoin pour générer
    # ses URL absolues et poser ses cookies sur le bon domaine.
    ProxyPreserveHost On

    # Les slugs de profil et les tags peuvent contenir des caractères encodés
    # (/profile/[slug], /hashtags/[tag]) : ne pas les décoder au passage.
    AllowEncodedSlashes NoDecode

    # Laisser certbot valider le domaine sans passer par l'application.
    ProxyPass /.well-known/acme-challenge/ !

    # --- L'application ------------------------------------------------------
    # Le conteneur Docker n'écoute qu'en loopback (cf. docker-compose.yml).
    ProxyPass        / http://127.0.0.1:3000/ retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # L'API Dughu peut être lente ; laisser de la marge au-delà du timeout
    # applicatif (DUGHU_API_TIMEOUT).
    ProxyTimeout 120

    # Uploads : transitent par les routes API vers le backend Dughu.
    # 50 Mo, cohérent avec la limite de 100 Mo du plan Cloudflare gratuit.
    LimitRequestBody 52428800

    # Les cookies de session (dughu_token, dughu_user_id) portent l'attribut
    # `secure` en production. Sans cet en-tête, l'application ne saurait pas
    # que la requête d'origine est en HTTPS.
    # `expr=` évalue le schéma réel : correct dans ce vhost comme dans le
    # vhost :443 que certbot en dérivera.
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    # --- En-têtes de sécurité -----------------------------------------------
    # Contrairement à nginx, `Header always set` posé ici s'applique aussi
    # dans les blocs <Location> ci-dessous : pas besoin de le répéter.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Environnement de recette : ne pas laisser les moteurs l'indexer.
    # À RETIRER lors du passage sur le domaine de production.
    Header always set X-Robots-Tag "noindex, nofollow"

    # --- Cache ---------------------------------------------------------------
    # Next.js sert déjà /_next/static avec
    #   Cache-Control: public, max-age=31536000, immutable
    # (vérifié) : rien à ajouter pour ces fichiers.
    #
    # En revanche les fichiers de public/ sortent en `public, max-age=0`.
    # Ceux de /images/ sont des assets statiques versionnés avec le dépôt :
    # on peut les mettre en cache.
    <Location "/images/">
        Header always set Cache-Control "public, max-age=2592000"
    </Location>

    # La sonde de santé ne doit jamais être mise en cache.
    <Location "/api/health">
        Header always set Cache-Control "no-store"
    </Location>

    # --- Journalisation -------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/testing.dughu.com-error.log
    CustomLog ${APACHE_LOG_DIR}/testing.dughu.com-access.log combined
</VirtualHost>


# =============================================================================
# À FAIRE une fois `testing` repassé en Proxied (nuage orange) sur Cloudflare
# =============================================================================
# Tant que le proxy Cloudflare est actif, Apache voit l'IP de Cloudflare et non
# celle du visiteur : tous les logs afficheront des IP Cloudflare. mod_remoteip
# rétablit la vraie IP à partir de l'en-tête CF-Connecting-IP.
#
# NE PAS activer ce bloc tant que l'enregistrement est en DNS only : sans le
# filtre RemoteIPTrustedProxy, n'importe qui pourrait usurper son IP.
#
#   sudo a2enmod remoteip
#   # Récupérer les plages Cloudflare à jour :
#   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
#
# Puis, DANS le vhost :443 généré par certbot :
#
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxy 173.245.48.0/20
#   RemoteIPTrustedProxy 103.21.244.0/22
#   ... (une ligne par plage retournée par les deux URL ci-dessus)
#
# Et remplacer `combined` par un format journalisant %a (IP réelle) :
#   LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" cf
#   CustomLog ${APACHE_LOG_DIR}/testing.dughu.com-access.log cf
# =============================================================================
