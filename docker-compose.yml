services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Seules les variables PUBLIQUES (NEXT_PUBLIC_*) sont nécessaires au
        # build : Next.js les inline dans le bundle client. Tout le reste est
        # injecté au runtime via env_file et n'entre jamais dans l'image.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    image: dughu-web:latest
    container_name: dughu-web
    restart: unless-stopped
    ports:
      # Écoute uniquement en loopback : c'est Nginx qui expose le service
      # au monde, avec TLS. Ne jamais publier sur 0.0.0.0 en production.
      # APP_PORT permet de cohabiter avec d'autres services : sur un serveur
      # où le port 3000 est déjà pris, le définir dans .env suffit — il faut
      # alors reporter la même valeur dans l'upstream du vhost Nginx.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
