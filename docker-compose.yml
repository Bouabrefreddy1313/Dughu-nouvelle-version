services:
app:
build:
context: .
dockerfile: Dockerfile
args:
# Uniquement les variables PUBLIQUES (exposées au navigateur) ont besoin
# d'être passées au build. Tout le reste (secrets) est injecté au runtime
# via env_file, jamais dans l'image.
NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
image: dughu-web:latest
container_name: dughu-web
restart: unless-stopped
ports:
- "3000:3000"
env_file:
- .env
environment:
# Ta base est sur Neon (cloud) donc pas de conteneur Postgres ici.
# Si un jour tu veux une DB Postgres locale, décommente le service
# "db" plus bas et pointe DATABASE_URL vers postgres://...@db:5432/...
NODE_ENV: production
healthcheck:
test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
interval: 30s
timeout: 5s
retries: 3
start_period: 10s

# ------------------------------------------------------------------
# Optionnel : Postgres local pour dev/offline, si tu ne veux pas
# dépendre de Neon en local. Décommente si besoin (`docker compose
# --profile db up`).
